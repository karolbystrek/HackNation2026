services:
  app:
    build:
      context: ./app
      # Domain data read by the form wizard from ../knowledge.
      additional_contexts:
        knowledge: ./knowledge
    env_file:
      - .env.supabase.local
      # Optional secrets such as GEMINI_API_KEY (see docs/local-development.md).
      - path: .env.local
        required: false
    environment:
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      NEXT_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 10
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app
          ignore:
            - package.json
            - package-lock.json
        - action: sync
          path: ./knowledge
          target: /knowledge
        - action: rebuild
          path: ./app/package.json
        - action: rebuild
          path: ./app/package-lock.json
